name: deploy

on:
  push:
    branches:
      - v1
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && github.ref_name == 'v1'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `packageManager: bun@…` in package.json makes setup-node v5+ try to
          # auto-cache a package manager it does not support. Bun is set up by
          # ./.github/actions/setup-bun instead.
          package-manager-cache: false
          node-version: "24"

      # Only the V1 web app (app.opencode.ai) deploys from v1.
      - run: bun sst deploy --stage=v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: web@${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: web@${{ github.sha }}
