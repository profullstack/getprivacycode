name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump || 'preview') }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.19.5)"
        required: false
        type: string
      bump:
        description: "Calculate the next major, minor, or patch version"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  contents: write

env:
  PRIVACYCODE_CHANNEL: ${{ (!inputs.bump && !inputs.version && 'dev') || '' }}

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'profullstack/getprivacycode' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACYCODE_BUMP: ${{ inputs.bump }}
          PRIVACYCODE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'profullstack/getprivacycode' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build and upload CLI archives
        run: ./packages/privacycode/script/build.ts
        env:
          PRIVACYCODE_VERSION: ${{ needs.version.outputs.version }}
          PRIVACYCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ github.token }}

  publish-release:
    needs:
      - version
      - build-cli
    runs-on: ubuntu-latest
    if: needs.version.outputs.release != ''
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest --repo "${{ needs.version.outputs.repo }}"
